<body>
  <div class="page" id="top" data-paper="loading">
    <div class="paper-loading" role="status"><span class="visually-hidden">Loading paper…</span></div>

    <main aria-busy="true">
      <header class="paper-head" id="paper">
        <p class="eyebrow">Paper &amp; project resources</p>
        <h1 id="paper-title">Classic Preprint</h1>
        <p class="authors" id="authors"></p>
        <p class="affiliations" id="affiliations"></p>

      <nav class="resource-links" aria-label="Paper resources">
        <a id="pdf-link" href="./classic-preprint.pdf">Paper (PDF)</a>
        <a id="arxiv-link" hidden>arXiv</a>
        <span id="arxiv-pending" class="unavailable" title="The arXiv link is not yet available">arXiv <small>(pending)</small></span>

      </nav>

          <summary>Contents</summary>

            <a class="contents-title" id="contents-title" href="#paper"></a>
            <ol class="contents-list" id="contents-list"></ol>
          </nav>
        </details>
      </aside>

      <article id="paper-content" aria-label="Paper text"></article>

      <section class="citation-panel" id="citation" aria-labelledby="citation-title">
        <div class="citation-heading">
          <h2 id="citation-title">BibTeX citation</h2>
        </div>
        <p class="citation-note">Copy or download the citation for this paper.</p>
        <div class="citation-toolbar"><span>BibTeX</span><div><button type="button" id="copy-bibtex" disabled>Copy</button><a id="download-bibtex" download="citation.bib">Download .bib</a></div></div>
        <pre class="bibtex"><code id="bibtex-text"></code></pre>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      </section>
    </main>

    <footer class="page-footer"><a href="https://github.com/lapalap/classic_preprint">Classic Preprint on GitHub</a><a href="#top">Back to top</a></footer>
  </div>
  <aside class="margin-preview" id="margin-preview" tabindex="-1" aria-label="Annotation" aria-hidden="true" inert>
    <h2 id="preview-title"></h2>
    <div class="preview-body" id="preview-body"></div>
  </aside>
  <p class="visually-hidden" id="interaction-status" role="status" aria-live="polite"></p>
